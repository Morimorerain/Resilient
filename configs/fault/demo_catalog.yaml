schema_version: 1
defaults:
  suite: libero_spatial
  task_id: 0
  initial_state_index: 0
  environment_seed: 42
  resolution: 256
  render_camera: frontview
  fps: 20

entries:
  - id: V1_camera_rotation
    kind: visual
    fault_config: configs/fault/catalog/visual/camera_rotation.yaml
  - id: V2_camera_translation
    kind: visual
    fault_config: configs/fault/catalog/visual/camera_translation.yaml
  - id: V3_defocus_blur
    kind: visual
    fault_config: configs/fault/catalog/visual/defocus_blur.yaml
  - id: V4_local_occlusion
    kind: visual
    fault_config: configs/fault/catalog/visual/local_occlusion.yaml
  - id: V5_illumination_change
    kind: visual
    fault_config: configs/fault/catalog/visual/illumination_change.yaml

  - id: E1_joint_motion_degradation
    kind: embodiment
    fault_config: configs/fault/catalog/structure/joint_motion_degradation.yaml
    controller: JOINT_POSITION
    action_dimension: 8
    phases:
      - {name: warmup, steps: 10, action: [0, 0, 0, 0, 0, 0, 0, -1]}
      - {name: joint1_positive, steps: 85, action: [0.80, 0, 0, 0, 0, 0, 0, -1]}
      - {name: settle, steps: 15, action: [0, 0, 0, 0, 0, 0, 0, -1]}
  - id: E2_joint_position_bias
    kind: embodiment
    fault_config: configs/fault/catalog/structure/joint_position_bias.yaml
    controller: JOINT_POSITION
    action_dimension: 8
    phases:
      - {name: warmup, steps: 10, action: [0, 0, 0, 0, 0, 0, 0, -1]}
      - {name: joint1_positive, steps: 60, action: [0.70, 0, 0, 0, 0, 0, 0, -1]}
      - {name: settle, steps: 20, action: [0, 0, 0, 0, 0, 0, 0, -1]}
  - id: E3_joint_backlash
    kind: embodiment
    fault_config: configs/fault/catalog/structure/joint_backlash.yaml
    controller: JOINT_POSITION
    action_dimension: 8
    phases:
      - {name: warmup, steps: 10, action: [0, 0, 0, 0, 0, 0, 0, -1]}

      - {name: joint1_right, steps: 65, action: [0.80, 0, 0, 0, 0, 0, 0, -1]}

      - {name: joint1_left, steps: 65, action: [-0.80, 0, 0, 0, 0, 0, 0, -1]}

      - {name: joint1_right_again, steps: 65, action: [0.80, 0, 0, 0, 0, 0, 0, -1]}

      - {name: settle, steps: 15, action: [0, 0, 0, 0, 0, 0, 0, -1]}
  - id: E4_joint_range_limitation
    kind: embodiment
    fault_config: configs/fault/catalog/structure/joint_range_limitation.yaml
    controller: JOINT_POSITION
    action_dimension: 8
    phases:
      - {name: warmup, steps: 10, action: [0, 0, 0, 0, 0, 0, 0, -1]}
      - {name: joint1_to_limit, steps: 85, action: [0.90, 0, 0, 0, 0, 0, 0, -1]}
      - {name: settle, steps: 15, action: [0, 0, 0, 0, 0, 0, 0, -1]}
  - id: E5_periodic_joint_freeze
    kind: embodiment
    fault_config: configs/fault/catalog/structure/periodic_joint_freeze.yaml
    controller: JOINT_POSITION
    action_dimension: 8
    phases:
      - {name: warmup, steps: 10, action: [0, 0, 0, 0, 0, 0, 0, -1]}
      - {name: joint1_positive, steps: 70, action: [0.75, 0, 0, 0, 0, 0, 0, -1]}
      - {name: joint1_reverse, steps: 70, action: [-0.75, 0, 0, 0, 0, 0, 0, -1]}
      - {name: settle, steps: 15, action: [0, 0, 0, 0, 0, 0, 0, -1]}
