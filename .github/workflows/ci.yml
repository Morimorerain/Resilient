name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint project-owned code
        run: ruff check src/resilient tests scripts/resilient

      - name: Run CPU tests
        env:
          PYTHONPATH: src
        run: python -m pytest -m "not gpu and not libero"
