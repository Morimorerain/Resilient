[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-fastwam"
version = "0.2.0"
description = "Reproducible FastWAM research on LIBERO."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "av==15.1.0",
  "boto3==1.35.99",
  "datasets==4.8.5",
  "deepspeed==0.18.7",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "mujoco==3.3.2",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==24.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1+cu128",
  "torchcodec==0.4.0",
  "torchvision==0.22.1+cu128",
  "tqdm==4.68.3",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
]

[project.optional-dependencies]
libero = [
  "bddl==1.0.1",
  "cloudpickle==2.1.0",
  "easydict==1.9",
  "future==0.18.2",
  "gym==0.25.2",
  "matplotlib==3.10.8",
  "opencv-python==4.12.0.88",
  "robosuite==1.4.0",
]

[project.scripts]
resilient = "resilient.__main__:main"

[project.urls]
Repository = "https://github.com/Morimorerain/Resilient"
FastWAM = "https://github.com/yuantianyuan01/FastWAM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastwam*", "resilient*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires an NVIDIA GPU and the full FastWAM environment",
  "libero: requires the LIBERO simulator and assets",
]
